name: Atualizar notícias

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: news
  cancel-in-progress: false

jobs:
  news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/fetch-news.mjs /tmp/news.json
      - name: Publicar news.json no gh-pages
        run: |
          git fetch origin gh-pages --depth=1
          git worktree add /tmp/site gh-pages
          cp /tmp/news.json /tmp/site/news.json
          cd /tmp/site
          git config user.name "treend-bot"
          git config user.email "actions@users.noreply.github.com"
          git add news.json
          git commit -m "news: $(date -u '+%Y-%m-%d %H:%M')" || exit 0
          git push origin gh-pages
