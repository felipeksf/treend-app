name: Atualizar notícias

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: news
  cancel-in-progress: false

jobs:
  news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: curl -sf https://novo.treend.com.br/gnews-map.json -o /tmp/gnews-map.json || echo '{}' > /tmp/gnews-map.json
      - run: GNEWS_MAP=/tmp/gnews-map.json node scripts/fetch-news.mjs /tmp/news.json
      - run: GNEWS_MAP=/tmp/gnews-map.json node scripts/fetch-asset-news.mjs /tmp/news-assets.json || echo 'aviso: notícias por ativo não atualizadas'
      - name: Publicar news.json no gh-pages
        run: |
          git fetch origin gh-pages --depth=1
          git worktree add /tmp/site gh-pages
          cp /tmp/news.json /tmp/site/news.json
          [ -f /tmp/news-assets.json ] && cp /tmp/news-assets.json /tmp/site/news-assets.json
          cp /tmp/gnews-map.json /tmp/site/gnews-map.json
          cd /tmp/site
          git config user.name "treend-bot"
          git config user.email "actions@users.noreply.github.com"
          git add news.json news-assets.json gnews-map.json
          git commit -m "news: $(date -u '+%Y-%m-%d %H:%M')" || exit 0
          git push origin gh-pages
